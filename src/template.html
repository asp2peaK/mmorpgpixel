<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Пожиратель Душ</title>
<style>
html,body{margin:0;height:100%;background:#07060a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Lucida Console","DejaVu Sans Mono","Liberation Mono","Courier New",monospace;color:#d6cdb8}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#ui{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,3,6,.8);z-index:5;padding:8px;box-sizing:border-box}
#ui.on{display:flex}
.panel{background:#16130f;border:3px solid #6b5638;outline:3px solid #07060a;box-shadow:inset 0 0 0 3px #231d15,0 0 60px #000;width:min(600px,100%);max-height:100%;overflow:auto;box-sizing:border-box;padding:16px;font-size:14px;line-height:1.35}
.panel.wide{width:min(940px,100%)}
.panel h1{margin:0 0 4px;font-size:30px;letter-spacing:5px;color:#b8323a;text-shadow:3px 3px 0 #000;text-align:center}
.panel h2{margin:0 0 12px;font-size:18px;letter-spacing:2px;text-transform:uppercase;color:#c8a850;border-bottom:2px solid #3a3024;padding-bottom:8px}
.panel h3{margin:14px 0 6px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#a8946a}
.sub{color:#7d7462;font-size:12px;text-align:center;margin-bottom:10px;letter-spacing:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.res{float:right;font-size:13px;letter-spacing:0;text-transform:none;display:flex;gap:14px;margin-right:44px}
.btn{background:#2a231a;border:2px solid #6b5638;box-shadow:inset 0 -3px 0 #1c1711;color:#e6dcc4;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;border-radius:0;letter-spacing:1px}
.btn:hover{background:#3a3024;border-color:#c8a850}.btn:active{box-shadow:none;transform:translateY(1px)}
.btn.gold{background:#4a3a14;border-color:#c8a850;color:#ffe9a0}.btn.red{background:#3a1418;border-color:#a8323a;color:#ffb0b0}
.btn[disabled]{opacity:.35;cursor:default}
.tabs{display:flex;gap:0;margin-bottom:12px;border-bottom:3px solid #6b5638}
.tabs .btn{flex:1;padding:9px 2px;border-bottom:none;margin-right:-2px;background:#1c1711;color:#8a7f68;box-shadow:none;font-size:13px}
.tabs .btn.act{background:#6b5638;color:#fff3d0;border-color:#c8a850}
.tabs .btn small{display:block;font-size:10px;opacity:.6;font-weight:400}
.x{float:right;margin:-6px -6px 0 8px;padding:5px 11px}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;align-items:start}
.cl,.cr{max-height:calc(100vh - 190px);overflow:auto;padding-right:4px}
.cr{position:sticky;top:0}
@media(max-width:720px){.cols{grid-template-columns:1fr}.cl,.cr{max-height:none}.cr{position:static}.res{float:none;margin:6px 0 0;gap:12px;font-size:12px}.panel{padding:10px}.panel h2{font-size:15px}.tabs .btn{font-size:10px;letter-spacing:0;padding:9px 0}}
input.name{background:#07060a;border:2px solid #6b5638;color:#fff3d0;font:inherit;font-size:18px;padding:9px;width:100%;box-sizing:border-box;text-align:center;letter-spacing:2px;-webkit-user-select:text;user-select:text}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:6px}
.soul{display:flex;gap:7px;align-items:center;background:#1c1711;border:2px solid #3a3024;padding:5px;cursor:pointer;min-height:44px}
.soul:hover{background:#2a231a}.soul.sel{border-color:#ffe9a0!important;background:#3a3024;box-shadow:0 0 0 2px #c8a850}.soul.dim{opacity:.45}
.soul img,.slot img,.big img{image-rendering:pixelated;width:32px;height:32px;flex:none}
.soul b{display:block;font-size:12px;line-height:1.2}.soul small{color:#c8a850;font-size:11px}
.slots{display:flex;gap:6px;margin-bottom:10px}
.slot{flex:1;background:#0d0b08;border:2px solid #4a3e2c;min-height:62px;text-align:center;padding:4px;font-size:11px;cursor:pointer;position:relative}
.slot:hover{border-color:#c8a850}
.slot i{position:absolute;left:4px;top:2px;color:#7d7462;font-style:normal;font-size:10px;text-transform:uppercase}
.det{background:#0d0b08;border:2px solid #3a3024;border-left:4px solid #6b5638;padding:10px;margin-top:8px;font-size:13px;line-height:1.5}
.det .el{display:inline-block;padding:0 6px;color:#07060a;font-weight:700}
.q{color:#6a6252}.ok{color:#8fd07a}.bad{color:#e06a6a}.gd{color:#e0c060}.sh{color:#8ad0ff}
.big{display:flex;align-items:center;justify-content:center;gap:12px;font-size:20px;margin:10px 0}
.big img{width:64px;height:64px}
ul.j{margin:0;padding:0;list-style:none}ul.j li{padding:5px 0;border-bottom:1px solid #2a231a;font-size:13px}
.help{font-size:12px;color:#8a7f68;line-height:1.6;margin-top:12px;border-top:2px solid #3a3024;padding-top:10px}
kbd{background:#2a231a;padding:0 5px;border:1px solid #6b5638;font:inherit;font-size:11px;color:#e0c060}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#6b5638}::-webkit-scrollbar-track{background:#0d0b08}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script>
(function(){
'use strict';
/*__JS__*/
})();
</script>
</body>
</html>
