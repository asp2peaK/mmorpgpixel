<!DOCTYPE html>
<html lang="ru">

<style>
html,body{margin:0;height:100%;background:#0b0810;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#e8e0f0}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#ui{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,5,14,.72);z-index:5;padding:8px;box-sizing:border-box}
#ui.on{display:flex}
.panel{background:#1a1424;border:3px solid #6a4a9a;box-shadow:0 0 0 3px #0b0810,0 0 40px rgba(140,90,255,.25);width:min(640px,100%);max-height:100%;overflow:auto;box-sizing:border-box;padding:14px;font-size:15px}
.panel h1{margin:0 0 4px;font-size:28px;letter-spacing:2px;color:#c9a0ff;text-shadow:2px 2px 0 #3a1a6a;text-align:center}
.panel h2{margin:0 0 10px;font-size:19px;color:#c9a0ff}
.panel h3{margin:12px 0 6px;font-size:15px;color:#ffd870}
.sub{color:#9a8ab0;font-size:13px;text-align:center;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:#3a2a5a;border:2px solid #8a6aca;color:#fff;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;border-radius:0}
.btn:hover{background:#4c3878}.btn:active{background:#2a1e42}
.btn.gold{background:#6a4a10;border-color:#ffd870}.btn.red{background:#5a1a22;border-color:#ff6a6a}
.btn[disabled]{opacity:.4;cursor:default}
.tabs{display:flex;gap:4px;margin-bottom:10px}.tabs .btn{flex:1;padding:8px 4px}.tabs .btn.act{background:#8a6aca;color:#0b0810}
.x{float:right;margin:-4px -4px 0 8px;padding:4px 10px}
input.name{background:#0b0810;border:2px solid #8a6aca;color:#fff;font:inherit;font-size:18px;padding:8px;width:100%;box-sizing:border-box;text-align:center;-webkit-user-select:text;user-select:text}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.soul{display:flex;gap:6px;align-items:center;background:#241a34;border:2px solid #3a2a5a;padding:5px;cursor:pointer;min-height:44px}
.soul.sel{border-color:#ffd870;background:#3a2a4a}.soul.dim{opacity:.45}
.soul img,.slot img,.big img{image-rendering:pixelated;width:32px;height:32px;flex:none}
.soul b{display:block;font-size:13px;line-height:1.15}.soul small{color:#ffd870;font-size:12px}
.slots{display:flex;gap:6px;margin-bottom:10px}
.slot{flex:1;background:#120c1c;border:2px solid #4a3a6a;min-height:58px;text-align:center;padding:4px;font-size:11px;cursor:pointer;position:relative}
.slot i{position:absolute;left:3px;top:1px;color:#9a8ab0;font-style:normal}
.det{background:#120c1c;border:2px solid #3a2a5a;padding:8px;margin-top:8px;font-size:14px;line-height:1.4}
.det .el{display:inline-block;padding:0 6px;color:#0b0810;font-weight:700}
.q{color:#6a5a80}.ok{color:#8fe08a}.bad{color:#ff7a7a}.gd{color:#ffd870}
.big{display:flex;align-items:center;justify-content:center;gap:12px;font-size:22px;margin:10px 0}
.big img{width:48px;height:48px}
ul.j{margin:0;padding:0;list-style:none}ul.j li{padding:4px 0;border-bottom:1px solid #2a2038;font-size:14px}
.help{font-size:13px;color:#b0a0c8;line-height:1.5;margin-top:10px}
kbd{background:#3a2a5a;padding:0 5px;border:1px solid #8a6aca;font:inherit;font-size:12px}
</style>

<script>
(function(){
'use strict';
// ===== 00_util.js =====
// Утилиты, шум, изометрия, общее состояние игры
const TAU = Math.PI * 2, SEED = 1337;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const rand = (a, b) => a === undefined ? Math.random() : b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
function norm(x, y) { const l = Math.hypot(x, y); return l > 1e-6 ? [x / l, y / l] : [0, 0]; }
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y, s) { let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1442695041); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s) { return vnoise(x, y, s) * .5 + vnoise(x * 2, y * 2, s + 11) * .3 + vnoise(x * 4, y * 4, s + 23) * .2; }

// Изометрия: тайл 32x16
const isoX = (x, y) => (x - y) * 16, isoY = (x, y) => (x + y) * 8;
// Виртуальный экран (низкое разрешение)
const V = { w: 427, h: 240, scale: 3, dpr: 1, touch: false };
// Всё состояние симуляции — в одном объекте (удобно для будущей синхронизации по сети)
const G = {
  time: 0, nid: 0, ents: [], projs: [], zones: [], parts: [], texts: [], fx: [], pickups: [], players: [], me: null,
  cam: { x: 0, y: 0, sx: 0, sy: 0, shake: 0 }, paused: true, hitstop: 0, started: false,
  systems: [], hud: [], J: null, nemesis: null, banner: null, canvas: null, buf: null
};
// Шина событий: подсистемы (журнал, немезида, UI) не знают друг о друге
const Bus = { h: {}, on(e, f) { (this.h[e] = this.h[e] || []).push(f); }, emit(e, a, b, c) { const l = this.h[e]; if (l) for (const f of l) f(a, b, c); } };
function w2s(x, y) { return [Math.round(isoX(x, y) - G.cam.sx), Math.round(isoY(x, y) - G.cam.sy)]; }
function s2w(px, py) { const a = (px + G.cam.sx) / 16, b = (py + G.cam.sy) / 8; return [(a + b) / 2, (b - a) / 2]; }
function shake(n) { if (n > G.cam.shake) G.cam.shake = n; }
function newJournal() { return { reactions: {}, recipes: {}, obtained: {}, kills: 0, deaths: 0, nemKills: 0, bossKills: 0, hints: {} }; }

// ===== 01_audio.js =====
// Звук: всё синтезируется через WebAudio
const Sfx = (() => {
  let ac = null, master = null, nbuf = null; const last = {};
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .32; master.connect(ac.destination); } catch (e) { ac = null; }
  }
  function tone(type, f0, f1, dur, vol, delay) {
    const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol || .25, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, vol, freq, type, delay) {
    if (!nbuf) { nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t = ac.currentTime + (delay || 0), s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = nbuf; f.type = type || 'lowpass'; f.frequency.value = freq || 1200;
    g.gain.setValueAtTime(vol || .25, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * .5, dur + .02);
  }
  const lib = {
    swing() { noise(.09, .14, 2600, 'highpass'); },
    hit() { noise(.07, .28, 900); tone('square', 190, 60, .08, .16); },
    hurt() { tone('sawtooth', 240, 70, .18, .25); noise(.1, .2, 500); },
    roll() { noise(.16, .12, 1500, 'bandpass'); },
    dash() { noise(.2, .2, 2200, 'bandpass'); tone('sawtooth', 300, 90, .15, .1); },
    fire() { noise(.3, .25, 700); tone('sawtooth', 160, 60, .25, .12); },
    water() { noise(.35, .22, 1800, 'bandpass'); tone('sine', 500, 180, .3, .1); },
    zap() { tone('square', 1400, 120, .14, .16); noise(.12, .22, 5000, 'highpass'); },
    wind() { noise(.5, .16, 900, 'bandpass'); },
    poison() { tone('sine', 180, 320, .25, .14); noise(.3, .1, 500); },
    roots() { noise(.25, .22, 300); tone('triangle', 110, 60, .2, .18); },
    arrow() { noise(.07, .16, 4000, 'highpass'); tone('triangle', 900, 500, .06, .08); },
    shield() { tone('sine', 300, 700, .25, .18); },
    boom() { noise(.5, .5, 350); tone('sine', 120, 30, .45, .4); },
    steam() { noise(.6, .18, 6000, 'highpass'); },
    pickup() { tone('square', 700, 1100, .07, .1); },
    coin() { tone('square', 1100, 1500, .05, .08); tone('square', 1500, 1900, .06, .08, .05); },
    soul() { tone('sine', 440, 880, .25, .2); tone('sine', 660, 1320, .3, .16, .12); tone('triangle', 880, 1760, .4, .12, .24); },
    levelup() { [523, 659, 784, 1046].forEach((f, i) => tone('square', f, f, .14, .14, i * .09)); },
    death() { tone('sawtooth', 300, 40, .9, .3); noise(.6, .2, 300); },
    banner() { tone('triangle', 392, 392, .15, .2); tone('triangle', 587, 587, .15, .2, .12); tone('triangle', 784, 784, .35, .2, .24); },
    ui() { tone('square', 600, 700, .04, .08); },
    deny() { tone('square', 160, 120, .1, .1); },
    potion() { tone('sine', 300, 600, .12, .16); tone('sine', 450, 900, .14, .14, .1); },
    howl() { tone('sawtooth', 180, 420, .5, .25); tone('sawtooth', 420, 140, .7, .25, .5); },
    fuse() { tone('sine', 200, 900, .6, .2); noise(.6, .12, 3000, 'bandpass'); tone('triangle', 900, 1400, .4, .18, .55); }
  };
  function play(n) { if (!ac) return; const now = performance.now(); if (last[n] && now - last[n] < 45) return; last[n] = now; try { lib[n] && lib[n](); } catch (e) { } }
  return { init, play };
})();

const SPR = {};
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function silhouette(c, color) { const o = mkCanvas(c.width, c.height), x = o.getContext('2d'); x.drawImage(c, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height); return o; }
function outlineCanvas(c, color) {
  const o = mkCanvas(c.width + 2, c.height + 2), x = o.getContext('2d'), s = silhouette(c, color || '#120c18');
  x.drawImage(s, 0, 1); x.drawImage(s, 2, 1); x.drawImage(s, 1, 0); x.drawImage(s, 1, 2); x.drawImage(c, 1, 1); return o;
}
function ascii(rows, pal, noOutline) {
  const h = rows.length, w = Math.max.apply(null, rows.map(r => r.length)), c = mkCanvas(w, h), x = c.getContext('2d');
  for (let j = 0; j < h; j++) for (let i = 0; i < rows[j].length; i++) { const col = pal[rows[j][i]]; if (col) { x.fillStyle = col; x.fillRect(i, j, 1, 1); } }
  return noOutline ? c : outlineCanvas(c);
}
function scaled(c, k) { const o = mkCanvas(c.width * k, c.height * k), x = o.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(c, 0, 0, o.width, o.height); return o; }
function reg(n, c) { return SPR[n] = { c, w: c.width, h: c.height, white: silhouette(c, '#fff') }; }
// Рисует спрайт с якорем «ноги по центру снизу»
function drawSpr(ctx, n, sx, sy, flip, white, sc) {
  const s = SPR[n]; if (!s) return; const img = white ? s.white : s.c;
  if (flip || sc) { ctx.save(); ctx.translate(sx, sy); ctx.scale((flip ? -1 : 1) * (sc ? sc[0] : 1), sc ? sc[1] : 1); ctx.drawImage(img, -(s.w >> 1), -s.h); ctx.restore(); }
  else ctx.drawImage(img, sx - (s.w >> 1), sy - s.h);
}

// ---------- Огонь, лужи, зарастание ----------
const flammable = i => !!FL[W.g[i]] || W.o[i] === O.TREE;

}

  if (ch) { W.regrow[i] = G.time + (W.o[i] === O.DEAD && W.o0[i] === O.TREE ? rand(110, 150) : rand(50, 80)); W.regrowing.add(i); W.mapDirty = true; }
}

    let near = false; for (const p of G.players) if (dist(p.x, p.y, i % MW + .5, (i / MW | 0) + .5) < 1.2) near = true;

// ===== 04_entities.js =====
// Сущности: общая модель для игрока, мобов и призванных существ. Команда — поле team.
// RX — точки подключения системы реакций стихий (см. 06_reactions.js)
const RX = { hit() { return false; }, tile() { }, mix(e) { delete e.st.burn; } };

function mkEnt(o) {
  return Object.assign({ id: ++G.nid, x: 0, y: 0, r: .32, team: 2, hp: 10, maxHp: 10, atk: 5, spd: 3, face: 1, dirx: 1, diry: 0, st: {}, kx: 0, ky: 0, flash: 0, inv: 0, dead: false, shield: 0, shieldT: 0, shieldEl: null, anim: rand(9), toss: 0, immune: {}, dotT: rand(.5), moving: false }, o);

// ---------- Статусы ----------

// ---------- Движение с коллизией по тайлам ----------
function blk(x, y, r, f) { return blocked(x - r, y - r, f) || blocked(x + r, y - r, f) || blocked(x - r, y + r, f) || blocked(x + r, y + r, f); }

}

// ---------- Общий тик сущности ----------
function updateEntCommon(e, dt) {

    if (s.poison && !e.dead) damage(e, s.poison.v * .5, s.poison.src, { dot: 1, color: '#a6e23c' });

    if (s.poison) part(e.x + rand(-.3, .3), e.y + rand(-.3, .3), rand(6, 14), 0, 0, rand(8, 16), .6, '#a6e23c', 1, -5);

// ---------- Частицы, текст, эффекты ----------
function part(x, y, z, vx, vy, vz, life, color, size, grav, glow) { if (G.parts.length > 900) return; G.parts.push({ x, y, z, vx, vy, vz, life, max: life, color, size: size || 1, grav: grav === undefined ? 90 : grav, glow }); }

  for (let i = 0; i < n; i++) { const a = rand(TAU), s = rand(.3, 1) * sp; part(x, y, o.z || 6, Math.cos(a) * s, Math.sin(a) * s, rand(15, 55) * (o.up === undefined ? 1 : o.up), rand(.25, .6) * (o.life || 1), Array.isArray(color) ? pick(color) : color, o.size || 1, o.grav, o.glow); }
}

function floatNum(x, y, n, color) { if (G.texts.length > 80) G.texts.shift(); G.texts.push({ x: x + rand(-.25, .25), y: y + rand(-.25, .25), z: 20, num: n, color, life: .8, max: .8, vx: rand(-.4, .4) }); }
function floatText(x, y, s, color, size) { G.texts.push({ x, y, z: 26, s, color: color || '#fff', life: 1.5, max: 1.5, size: size || 7 }); }
function fxBolt(x0, y0, x1, y1, color, z0, z1) {

  for (let i = 0; i <= n; i++) { const t = i / n, j = i === 0 || i === n ? 0 : .28; pts.push([lerp(x0, x1, t) + rand(-j, j), lerp(y0, y1, t) + rand(-j, j), lerp(z0 === undefined ? 10 : z0, z1 === undefined ? 8 : z1, t)]); }

// ---------- Снаряды (не зависят от того, кто выпустил) ----------

function projImpact(p, e) {
